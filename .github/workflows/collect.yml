name: Collect JC Football Data

on:
  workflow_dispatch:
    inputs:
      matches:
        description: '比赛列表（每行一条，格式：周三003 日职 水户蜀葵 VS 鹿岛鹿角）'
        required: true
      date:
        description: '目标日期（YYYY-MM-DD，默认今天）'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run collector
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          INPUT_MATCHES: ${{ github.event.inputs.matches }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: python src/main.py

      - name: Upload data and debug files
        uses: actions/upload-artifact@v4
        with:
          name: jc-football-data
          path: |
            output/*.json
            output/debug/
          if-no-files-found: warn
